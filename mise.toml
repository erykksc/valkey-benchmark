[tools]
gcloud = "latest"
go = "latest"
python = "3"
terraform = "latest"
uv = "latest"

[tasks.valkey-docker]
description = "Run valkey docker image"
run = "docker run --rm valkey/valkey:9.0.1"

[tasks.build]
description = "Build binaries for benchmark"
run = "docker build -f Dockerfile.build -t valkey-builder --output ./bin ."
