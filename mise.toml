[tools]
gcloud = "latest"
go = "latest"
python = "3"
terraform = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = true

[task_config]
# NOTE: scripts defined in `scripts/` are used for production
includes = [
    "scripts"
]

# NOTE: Tasks defined in this file serve only the development needs

[tasks.valkey-docker]
description = "Run valkey docker image. This is used only for development"
run = '''
#!/usr/bin/env bash
# Calculate the cores to use, equivalent to min(nproc-1, 1)
NUM_CORES=$(nproc)
CORES_MINUS_ONE=$((NUM_CORES - 1))
RESULT=$((CORES_MINUS_ONE < 1 ? 1 : CORES_MINUS_ONE))

docker run --rm -p 6379:6379 valkey/valkey:9.0.1 \
    --io-threads "$RESULT" \
    --requirepass "csb-benchmark" \
    --appendonly yes
'''

[tasks.build]
description = "Build binaries for benchmark"
run = "docker build -f Dockerfile.build -t valkey-builder --output ./bin ."

[tasks.redeploy]
description = "Deploy the benchmark on GCP"
depends = ["build"]
run = '''
#!/usr/bin/env bash
cd terraform 
terraform init
terraform destroy --auto-approve 
terraform apply --auto-approve
'''

[tasks.destroy]
description = "Destory the deployed infrastructure"
run = "cd terraform && terraform destroy --auto-approve"
